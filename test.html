<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test4</title>
</head>
<body style="margin:0;background:#0A0F1E;color:#fff;font:14px -apple-system,sans-serif;padding:20px 16px">
<h2 style="color:#0EC9BC;margin:0 0 10px">Test iframe de la app</h2>
<div id="out" style="font-size:13px;white-space:pre-wrap;word-break:break-word;line-height:1.6;margin-bottom:16px"></div>
<div style="border:2px solid #0EC9BC;border-radius:8px;overflow:hidden;height:340px">
  <iframe id="fr" src="index.html?iframe=1&ts=CACHEBUST" style="width:100%;height:100%;border:none;background:#000"></iframe>
</div>
<script>
var out=document.getElementById('out');
function log(m,c){var d=document.createElement('div');if(c)d.style.color=c;d.textContent=m;out.appendChild(d);}
document.getElementById('fr').src='index.html?iframe=1&ts='+Date.now();
log('Cargando index.html dentro del recuadro de abajo...','#0EC9BC');
var fr=document.getElementById('fr');
fr.addEventListener('load',function(){
  log('El iframe termino de cargar.','#0EC9BC');
  try{
    var idoc=fr.contentDocument;
    var app=idoc.getElementById('app');
    var bl=idoc.getElementById('bootLoader');
    var gate=idoc.getElementById('roleGate');
    log('app existe: '+(!!app)+' | hijos: '+(app?app.children.length:'-'),'#8B9');
    log('bootLoader presente: '+(!!bl),'#8B9');
    log('roleGate presente: '+(!!gate)+' | visible(on): '+(gate?gate.className.indexOf('on')>=0:'-'),'#8B9');
    log('body clases: '+idoc.body.className,'#8B9');
    // texto visible en el iframe
    var vis=(idoc.body.innerText||'').trim().slice(0,120);
    log('texto visible: '+(vis||'(vacio)'),vis?'#0EC9BC':'#F97316');
  }catch(e){ log('No pude inspeccionar el iframe: '+(e&&e.message),'#F97316'); }
});
// errores dentro del iframe llegan al padre a veces
window.addEventListener('error',function(ev){ log('ERROR: '+(ev.message||'?')+' @'+(ev.lineno||'?'),'#F97316'); },true);
</script>
</body>
</html>
