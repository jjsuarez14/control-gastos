<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test2</title>
</head>
<body style="margin:0;background:#0A0F1E;color:#fff;font:15px -apple-system,sans-serif;padding:30px 18px">
<h2 style="color:#0EC9BC;margin:0 0 12px">Diagnostico de la app</h2>
<p style="margin:0 0 16px;color:#8B9">Cargando el codigo real de la app y capturando cualquier error...</p>
<div id="out" style="font-size:13px;white-space:pre-wrap;word-break:break-word;line-height:1.6"></div>
<script>
var out=document.getElementById('out');
function log(msg,color){ var d=document.createElement('div'); if(color)d.style.color=color; d.textContent=msg; out.appendChild(d); }
log('1) Descargando index.html...','#0EC9BC');
fetch('index.html?ts='+Date.now(),{cache:'no-store'})
  .then(function(r){ return r.text(); })
  .then(function(html){
    log('2) Descargado ('+html.length+' bytes). Extrayendo el script principal...','#0EC9BC');
    var m=html.match(/<script>([\s\S]*?)<\/script>/);
    if(!m){ log('No se encontro <script>','#F97316'); return; }
    var code=m[1];
    log('3) Script extraido ('+code.length+' chars). Intentando PARSEAR...','#0EC9BC');
    try{
      new Function(code);
      log('OK El script PARSEA sin error de sintaxis en este navegador.','#0EC9BC');
      log('=> El problema NO es de sintaxis. Es de ejecucion/orden.','#8B9');
    }catch(e){
      log('ERROR DE SINTAXIS al parsear el script principal:','#F97316');
      log('   '+(e&&e.message||e),'#F97316');
      log('   (este es el motivo de la pantalla azul)','#F97316');
    }
  })
  .catch(function(e){ log('Fallo al descargar index.html: '+(e&&e.message||e),'#F97316'); });
</script>
</body>
</html>
